name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "26" }

      - run: pip install -e .
      - run: pip install pytest pyinstaller
      - run: pytest

      - run: pyinstaller payload_revealer_engine.spec
      - run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist/payload_revealer_engine.exe "release-assets/payload_revealer_engine-${GITHUB_REF_NAME}-win64.exe"
          installer=$(ls "dist/"*.exe | grep -i "Setup")
          cp "$installer" "release-assets/Payload-Revealer-Setup-${GITHUB_REF_NAME}-win64.exe"

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
